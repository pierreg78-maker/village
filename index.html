<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Roue de la Fortune</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-secondary: #1a1510;
            --fg: #fdf6e3;
            --muted: #8a7e6b;
            --accent: #d4a017;
            --accent-glow: #f5c842;
            --card: rgba(30, 25, 18, 0.92);
            --border: rgba(212, 160, 23, 0.3);
            --danger: #c0392b;
            --success: #27ae60;
            --pink: #e84393;
            --pink-light: #fd79a8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(212, 160, 23, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(192, 57, 43, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, rgba(39, 174, 96, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ============ GUIRLANDES — 4 CÔTÉS ============ */
        .garland {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
        }

        /* Fils horizontaux */
        .garland-top::after,
        .garland-bottom::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: rgba(120, 100, 60, 0.5);
            transition: all 0.3s;
        }
        .garland-top::after { top: 9px; }
        .garland-bottom::after { bottom: 9px; }

        /* Fils verticaux */
        .garland-left::after,
        .garland-right::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 1px;
            background: rgba(120, 100, 60, 0.5);
            transition: all 0.3s;
        }
        .garland-left::after { left: 9px; }
        .garland-right::after { right: 9px; }

        /* Guirlandes haut et bas */
        .garland-top,
        .garland-bottom {
            left: 0; right: 0;
            height: 32px;
            display: flex;
            align-items: flex-start;
            justify-content: space-evenly;
            padding: 0 8px;
        }
        .garland-top { top: 0; }
        .garland-bottom { bottom: 0; }
        .garland-top .garland-bulb { margin-top: 10px; }
        .garland-bottom .garland-bulb { margin-bottom: 10px; margin-top: auto; }

        /* Guirlandes gauche et droite */
        .garland-left,
        .garland-right {
            top: 0; bottom: 0;
            width: 32px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-evenly;
            padding: 8px 0;
        }
        .garland-left { left: 0; }
        .garland-right { right: 0; }
        .garland-left .garland-bulb,
        .garland-right .garland-bulb { margin-left: 12px; }

        /* Ampoule */
        .garland-bulb {
            width: 7px;
            height: 10px;
            border-radius: 45% 45% 50% 50% / 55% 55% 45% 45%;
            flex-shrink: 0;
            position: relative;
            transition: transform 0.2s, filter 0.2s;
            animation: bulbGlow 2s ease-in-out infinite;
        }

        /* Connecteurs haut/bas */
        .garland-top .garland-bulb::before,
        .garland-bottom .garland-bulb::before {
            content: '';
            position: absolute;
            width: 1px; height: 5px;
            left: 50%; transform: translateX(-50%);
            background: rgba(120, 100, 60, 0.5);
        }
        .garland-top .garland-bulb::before { top: -5px; }
        .garland-bottom .garland-bulb::before { bottom: -5px; top: auto; }

        /* Connecteurs gauche/droite */
        .garland-left .garland-bulb::before,
        .garland-right .garland-bulb::before {
            content: '';
            position: absolute;
            width: 5px; height: 1px;
            top: 50%; transform: translateY(-50%);
            background: rgba(120, 100, 60, 0.5);
        }
        .garland-left .garland-bulb::before { left: -5px; }
        .garland-right .garland-bulb::before { left: -5px; }

        @keyframes bulbGlow {
            0%, 100% { opacity: 1; filter: brightness(1.15); }
            50% { opacity: 0.25; filter: brightness(0.5); }
        }

        /* ============ MODE CÉLÉBRATION DES GUIRLANDES ============ */
        body.celebrating .garland-bulb {
            animation: bulbCelebration 0.2s ease-in-out infinite !important;
            transform: scale(1.6);
        }

        @keyframes bulbCelebration {
            0%, 100% {
                opacity: 1;
                filter: brightness(3) saturate(2);
                transform: scale(1.6);
            }
            50% {
                opacity: 0.2;
                filter: brightness(0.6);
                transform: scale(0.8);
            }
        }

        /* Fils qui s'illuminent en arc-en-ciel */
        body.celebrating .garland-top::after,
        body.celebrating .garland-bottom::after {
            height: 3px;
            background: linear-gradient(90deg, #ff0044, #ffdd00, #00ff88, #00ccff, #ff00cc, #ff0044);
            background-size: 300% 100%;
            animation: wireGlowH 0.6s linear infinite;
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
        }

        body.celebrating .garland-left::after,
        body.celebrating .garland-right::after {
            width: 3px;
            background: linear-gradient(180deg, #ff0044, #ffdd00, #00ff88, #00ccff, #ff00cc, #ff0044);
            background-size: 100% 300%;
            animation: wireGlowV 0.6s linear infinite;
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
        }

        @keyframes wireGlowH {
            from { background-position: 0% 0%; }
            to { background-position: 300% 0%; }
        }
        @keyframes wireGlowV {
            from { background-position: 0% 0%; }
            to { background-position: 0% 300%; }
        }

        /* ============ CONTENEUR PRINCIPAL ============ */
        .game-container {
            max-width: 880px;
            margin: 0 auto;
            padding: 48px 20px 80px;
            position: relative;
            z-index: 10;
        }

        /* ============ HEADER ============ */
        .game-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--accent);
            text-shadow: 0 0 30px rgba(212, 160, 23, 0.25);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .gold-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 7px 20px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .gold-display i { color: var(--accent); font-size: 1.15rem; }

        .gold-amount {
            color: var(--accent-glow);
            min-width: 50px;
            text-align: right;
            transition: color 0.3s;
        }
        .gold-amount.negative { color: var(--danger); }

        /* ============ CATÉGORIE ============ */
        .category-display {
            text-align: center;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* ============ PHRASE — CASES À BORDURE FINE ============ */
        .phrase-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            margin-bottom: 26px;
            min-height: 54px;
            padding: 18px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .letter-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 42px;
            border: 1px solid rgba(253, 246, 227, 0.3);
            border-radius: 3px;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--fg);
            background: rgba(253, 246, 227, 0.03);
            transition: all 0.3s ease;
        }

        /* Apostrophe toujours visible, style neutre */
        .letter-box.apostrophe {
            border-color: rgba(253, 246, 227, 0.12);
            background: transparent;
            color: var(--muted);
            font-size: 1rem;
        }

        .letter-box.revealed {
            background: rgba(212, 160, 23, 0.13);
            border-color: rgba(212, 160, 23, 0.45);
            color: var(--accent-glow);
            animation: revealPop 0.4s ease-out;
        }

        .letter-box.won {
            background: rgba(39, 174, 96, 0.18);
            border-color: rgba(39, 174, 96, 0.5);
            color: #5dde9e;
            animation: none;
        }

        @keyframes revealPop {
            0% { transform: scale(1.25); background: rgba(212, 160, 23, 0.35); }
            100% { transform: scale(1); }
        }

        .space-gap {
            display: inline-block;
            width: 18px;
        }

        /* ============ SECTION ROUE ============ */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
        }

        .wheel-wrapper {
            position: relative;
            width: 270px;
            height: 270px;
            margin-bottom: 14px;
        }

        @media (min-width: 560px) {
            .wheel-wrapper { width: 340px; height: 340px; }
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 18px rgba(212, 160, 23, 0.18));
        }

        .wheel-pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 26px solid var(--accent);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            z-index: 5;
        }

        .spin-btn {
            background: linear-gradient(135deg, #d4a017, #b8860b);
            color: #1a1510;
            border: none;
            padding: 11px 34px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 160, 23, 0.35);
        }
        .spin-btn:active:not(:disabled) { transform: translateY(0); }
        .spin-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* Bouton "Faire une proposition" sous la roue */
        .guess-btn-wheel {
            margin-top: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 8px 26px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .guess-btn-wheel:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(212, 160, 23, 0.1);
            transform: translateY(-1px);
        }
        .guess-btn-wheel:disabled { opacity: 0.25; cursor: not-allowed; }
        .guess-btn-wheel i { margin-right: 5px; }

        .wheel-result {
            margin-top: 10px;
            font-size: 1.05rem;
            font-weight: 800;
            min-height: 26px;
            text-align: center;
            line-height: 1.3;
        }
        .wheel-result.positive { color: var(--accent-glow); }
        .wheel-result.negative { color: var(--danger); }

        /* ============ CLAVIER ============ */
        .keyboard-section { margin-bottom: 14px; }

        .keyboard-label {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 7px;
            text-align: center;
        }

        .vowel-cost-note {
            font-size: 0.72rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 6px;
            font-style: italic;
            line-height: 1.4;
        }

        .keyboard-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            max-width: 480px;
            margin: 0 auto;
        }

        .key-btn {
            width: 37px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--fg);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.92rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn:hover:not(:disabled) {
            background: rgba(212, 160, 23, 0.18);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .key-btn:disabled {
            opacity: 0.18;
            cursor: not-allowed;
            transform: none !important;
        }

        .key-btn.vowel { border-color: rgba(192, 57, 43, 0.35); }

        .key-btn.vowel:hover:not(:disabled) {
            background: rgba(192, 57, 43, 0.18);
            border-color: #c0392b;
        }

        .key-btn.used-correct {
            opacity: 1 !important;
            background: rgba(39, 174, 96, 0.2) !important;
            border-color: rgba(39, 174, 96, 0.5) !important;
            color: #5dde9e !important;
            cursor: default;
        }

        .key-btn.used-wrong {
            opacity: 1 !important;
            background: rgba(192, 57, 43, 0.12) !important;
            border-color: rgba(192, 57, 43, 0.25) !important;
            color: #a05050 !important;
            cursor: default;
        }

        /* ============ ACTIONS ============ */
        .actions-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 9px 22px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(212, 160, 23, 0.1);
        }
        .action-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .action-btn i { margin-right: 5px; }

        /* ============ LIGNE DU BAS ============ */
        .info-line {
            text-align: center;
            font-size: 0.84rem;
            color: var(--muted);
            margin-bottom: 12px;
            min-height: 20px;
            line-height: 1.4;
        }

        /* ============ BOUTON RETOUR AU VILLAGE — ROSE ============ */
        .back-btn {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            padding: 11px;
            background: transparent;
            border: 1px solid var(--pink);
            color: var(--pink-light);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background: rgba(232, 67, 147, 0.12);
            border-color: var(--pink-light);
            color: #fff;
            box-shadow: 0 0 16px rgba(232, 67, 147, 0.25);
        }
        .back-btn i { margin-right: 6px; }

        /* ============ TOASTS ============ */
        .toast-container {
            position: fixed;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 420px;
        }

        .toast {
            background: rgba(20, 18, 14, 0.95);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.86rem;
            text-align: center;
            animation: toastIn 0.35s ease-out, toastOut 0.4s ease-in forwards;
            animation-delay: 0s, 2.6s;
            box-shadow: 0 8px 28px rgba(0,0,0,0.6);
            line-height: 1.35;
        }

        .toast.success { border-color: var(--success); color: #5dde9e; }
        .toast.error { border-color: var(--danger); color: #e07070; }
        .toast.info { border-color: var(--accent); color: var(--accent-glow); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 1500;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.35rem;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .modal-input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 16px;
        }
        .modal-input:focus { border-color: var(--accent); }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 9px 22px;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #d4a017, #b8860b);
            color: #1a1510;
        }

        .modal-btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .modal-btn:hover { transform: translateY(-1px); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .letter-box {
                width: 24px;
                height: 32px;
                font-size: 0.82rem;
            }
            .space-gap { width: 10px; }
            .key-btn {
                width: 30px;
                height: 34px;
                font-size: 0.78rem;
            }
            .game-container { padding: 40px 8px 70px; }
            .phrase-container { padding: 12px 8px; gap: 3px; }
            .spin-btn { padding: 10px 24px; font-size: 0.9rem; }
            .guess-btn-wheel { padding: 7px 18px; font-size: 0.82rem; }
        }

        /* ============ RÉDUCTION DE MOUVEMENT ============ */
        @media (prefers-reduced-motion: reduce) {
            .garland-bulb { animation: none !important; opacity: 0.7; }
            .letter-box.revealed { animation: none !important; }
            .toast { animation: none !important; opacity: 1; }
            .modal-box { animation: none !important; }
        }
    </style>
</head>
<body>

    <!-- Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalContent"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <main class="game-container">
        <header class="game-header">
            <h1 class="game-title">La Roue de la Fortune</h1>
            <div class="gold-display" aria-live="polite">
                <i class="fas fa-coins" aria-hidden="true"></i>
                <span>Pièces d'or :</span>
                <span class="gold-amount" id="goldDisplay">0</span>
            </div>
        </header>

        <div class="category-display" id="categoryDisplay" aria-live="polite">Chargement...</div>

        <div class="phrase-container" id="phraseContainer" aria-label="Expression à deviner"></div>

        <section class="wheel-section" aria-label="Roue de la fortune">
            <div class="wheel-wrapper">
                <div class="wheel-pointer" aria-hidden="true"></div>
                <canvas id="wheelCanvas" width="680" height="680"></canvas>
            </div>
            <button class="spin-btn" id="spinBtn" aria-label="Faire tourner la roue">
                <i class="fas fa-sync-alt" aria-hidden="true"></i> Faire tourner la roue
            </button>
            <button class="guess-btn-wheel" id="guessBtnWheel" disabled aria-label="Faire une proposition">
                <i class="fas fa-lightbulb" aria-hidden="true"></i> Faire une proposition
            </button>
            <div class="wheel-result" id="wheelResult" aria-live="polite"></div>
        </section>

        <section class="keyboard-section" aria-label="Clavier des consonnes">
            <div class="keyboard-label">Consonnes</div>
            <div class="keyboard-grid" id="consonantGrid"></div>
        </section>

        <section class="keyboard-section" aria-label="Clavier des voyelles">
            <div class="keyboard-label">Voyelles <span style="color:var(--danger);font-weight:800;">(5 PO / occurrence)</span></div>
            <div class="vowel-cost-note">Le coût est de 5 pièces d'or par occurrence de la voyelle dans l'expression. Le solde peut devenir négatif.</div>
            <div class="keyboard-grid" id="vowelGrid"></div>
        </section>

        <section class="actions-section">
            <button class="action-btn" id="newGameBtn" aria-label="Nouvelle partie">
                <i class="fas fa-redo" aria-hidden="true"></i> Nouvelle partie
            </button>
        </section>

        const VOWELS = ["A", "E", "I", "O", "U", "Y"];
        const VOWEL_COST_PER_OCCURRENCE = 5;

        /* ============================================
           ÉTAT DU JEU
        ============================================ */
        let currentPhrase = "";

        let canChooseConsonant = false;
        let gameWon = false;
        let wheelAngle = 0;
        let spinVelocity = 0;
        let celebrationInterval = null;

        /* Couleurs originales des guirlandes (pour restauration) */
        let garlandOriginalColors = [];

        /* ============================================
           RÉFÉRENCES DOM
        ============================================ */
        const goldDisplayEl     = document.getElementById("goldDisplay");
        const categoryDisplayEl = document.getElementById("categoryDisplay");
        const phraseContainerEl = document.getElementById("phraseContainer");
        const spinBtnEl         = document.getElementById("spinBtn");
        const guessBtnWheelEl   = document.getElementById("guessBtnWheel");
        const wheelResultEl     = document.getElementById("wheelResult");
        const consonantGridEl   = document.getElementById("consonantGrid");
        const vowelGridEl       = document.getElementById("vowelGrid");
        const newGameBtnEl      = document.getElementById("newGameBtn");
        const infoLineEl        = document.getElementById("infoLine");
        const backBtnEl         = document.getElementById("backBtn");
        const canvasEl          = document.getElementById("wheelCanvas");
        const ctx               = canvasEl.getContext("2d");
        const toastContainerEl  = document.getElementById("toastContainer");
        const modalOverlayEl    = document.getElementById("modalOverlay");
        const modalTitleEl      = document.getElementById("modalTitle");
        const modalContentEl    = document.getElementById("modalContent");
        const modalActionsEl    = document.getElementById("modalActions");

        /* ============================================
           NORMALISATION DES LETTRES (accents → non accentuées)
        ============================================ */
        function normalizeLetter(ch) {
            return ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        }

        /* Vérifie si un caractère est une lettre (A-Z après normalisation) */
        function isAlpha(ch) {
            const n = normalizeLetter(ch);
            return n >= "A" && n <= "Z";
        }

        /* Compter les occurrences d'une lettre dans la phrase (après normalisation) */
        function countInPhrase(letter) {
            let n = 0;
            for (const ch of currentPhrase) {
                if (normalizeLetter(ch) === letter) n++;
            }
            return n;
        }

        /* ============================================
           GUIRLANDES — 4 CÔTÉS
        ============================================ */
        function createGarlands() {
            const bulbColors = [
                "#ff4444", "#ffdd44", "#44ff88", "#ff8844",
                "#44ddff", "#ff66aa", "#aaff44", "#ffaa22"
            ];
            const sides = ["top", "bottom", "left", "right"];

            sides.forEach(side => {
                const container = document.createElement("div");
                container.className = "garland garland-" + side;
                container.setAttribute("aria-hidden", "true");

                let count;
                if (side === "top" || side === "bottom") {
                    count = Math.max(8, Math.floor(window.innerWidth / 30));
                } else {
                    count = Math.max(6, Math.floor(window.innerHeight / 30));
                }

                for (let i = 0; i < count; i++) {
                    const bulb = document.createElement("div");
                    bulb.className = "garland-bulb";
                    const col = bulbColors[i % bulbColors.length];
                    bulb.style.backgroundColor = col;
                    bulb.style.boxShadow = "0 0 5px 2px " + col + ", 0 0 12px 4px " + col + "44";
                    bulb.style.animationDelay = (i * 0.18 % 2).toFixed(2) + "s";
                    bulb.style.animationDuration = (1.8 + (i % 3) * 0.4).toFixed(1) + "s";
                    /* Stocker la couleur originale */
                    bulb.dataset.origColor = col;
                    bulb.dataset.origShadow = "0 0 5px 2px " + col + ", 0 0 12px 4px " + col + "44";
                    container.appendChild(bulb);
                }

                document.body.appendChild(container);
            });
        }

        /* Restaure les couleurs originales des guirlandes */
        function restoreGarlandColors() {
            document.querySelectorAll(".garland-bulb").forEach(bulb => {
                bulb.style.backgroundColor = bulb.dataset.origColor;
                bulb.style.boxShadow = bulb.dataset.origShadow;
            });
        }

        /* ============================================
           CÉLÉBRATION DES GUIRLANDES
        ============================================ */
        function startCelebration() {
            document.body.classList.add("celebrating");

            const celebrationColors = [
                "#ff0044", "#ffdd00", "#00ff88", "#ff6600",
                "#00ccff", "#ff00cc", "#aaff00", "#ffaa00", "#ffffff"
            ];
            const bulbs = document.querySelectorAll(".garland-bulb");
            let tick = 0;

            celebrationInterval = setInterval(() => {
                tick++;
                bulbs.forEach((bulb, i) => {
                    const col = celebrationColors[(i + tick) % celebrationColors.length];
                    bulb.style.backgroundColor = col;
                    bulb.style.boxShadow = "0 0 12px 5px " + col + ", 0 0 30px 10px " + col + "88";
                });
            }, 100);

            /* Arrêter après 5 secondes */
            setTimeout(() => {
                clearInterval(celebrationInterval);
                celebrationInterval = null;
                document.body.classList.remove("celebrating");
                restoreGarlandColors();
            }, 5000);
        }

        /* ============================================
           ROUE — DESSIN
        ============================================ */
        const segCount = wheelSegments.length;
        const segAngle = (2 * Math.PI) / segCount;

        function drawWheel() {
            const w = canvasEl.width;
            const h = canvasEl.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = Math.max(10, Math.min(cx, cy) - 22);

            ctx.clearRect(0, 0, w, h);

            /* Anneaux extérieurs décoratifs */
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 14, 0, 2 * Math.PI);
            ctx.strokeStyle = "#d4a017";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, radius + 8, 0, 2 * Math.PI);
            ctx.strokeStyle = "#8b6914";
            ctx.lineWidth = 2;
            ctx.stroke();

            /* Segments */
            for (let i = 0; i < segCount; i++) {
                const start = wheelAngle + i * segAngle;
                const end = start + segAngle;
                const seg = wheelSegments[i];

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = seg.color;
                ctx.fill();

                ctx.strokeStyle = "rgba(0,0,0,0.35)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                /* Texte */
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + segAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";

                if (seg.value === "BANQUEROUTE") {
                    ctx.font = "bold 20px Cinzel, serif";
                    ctx.fillStyle = "#ff4444";
                    ctx.fillText("BANQUEROUTE", radius - 18, 0);
                } else {
                    ctx.font = "bold 36px Cinzel, serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(seg.label, radius - 22, 0);
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            /* Assombrir les bords */
            const depthGrad = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
            depthGrad.addColorStop(0, "rgba(255,255,255,0.07)");
            depthGrad.addColorStop(0.6, "rgba(0,0,0,0)");
            depthGrad.addColorStop(1, "rgba(0,0,0,0.25)");
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = depthGrad;
            ctx.fill();

            /* Rivets dorés entre segments */
            for (let i = 0; i < segCount; i++) {
                const a = wheelAngle + i * segAngle;
                const dx = cx + Math.cos(a) * (radius - 3);
                const dy = cy + Math.sin(a) * (radius - 3);
                ctx.beginPath();
                ctx.arc(dx, dy, 5, 0, 2 * Math.PI);
                ctx.fillStyle = "#d4a017";
                ctx.fill();
                ctx.strokeStyle = "#8b6914";
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            /* Centre (moyeu) */
            const hubGrad = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, 34);
            hubGrad.addColorStop(0, "#f5c842");
            hubGrad.addColorStop(0.6, "#d4a017");
            hubGrad.addColorStop(1, "#8b6914");
            ctx.beginPath();
            ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
            ctx.fillStyle = hubGrad;
            ctx.fill();
            ctx.strokeStyle = "#6b4f10";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
            ctx.fillStyle = "#1a1510";
            ctx.fill();
        }

        function getWinningSegment() {
            const pointerAngle = -Math.PI / 2;
            let norm = (pointerAngle - wheelAngle) % (2 * Math.PI);
            if (norm < 0) norm += 2 * Math.PI;
            const idx = Math.floor(norm / segAngle) % segCount;
            return wheelSegments[idx];
        }

        /* ============================================
           ROUE — ANIMATION
        ============================================ */
        function spinWheel() {
            if (isSpinning || gameWon) return;
            isSpinning = true;
            canChooseConsonant = false;
            spinBtnEl.disabled = true;
            guessBtnWheelEl.disabled = true;
            wheelResultEl.textContent = "";
            wheelResultEl.className = "wheel-result";
            infoLineEl.textContent = "La roue tourne...";

            spinVelocity = 0.22 + Math.random() * 0.22;

            function animate() {
                wheelAngle += spinVelocity;
                spinVelocity *= 0.984;
                drawWheel();

                if (spinVelocity > 0.001) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    handleWheelResult(getWinningSegment());
                }
            }

            requestAnimationFrame(animate);
        }

        function handleWheelResult(segment) {
            currentWheelValue = segment.value;

            if (segment.value === "BANQUEROUTE") {
                goldBalance = 0;
                updateGoldDisplay();
                wheelResultEl.textContent = "Banqueroute ! Solde remis a zero.";
                wheelResultEl.className = "wheel-result negative";
                showToast("Banqueroute ! Toutes vos pieces perdues.", "error");
                infoLineEl.textContent = "Banqueroute ! Faites tourner la roue a nouveau.";
                currentWheelValue = null;
                spinBtnEl.disabled = false;

            } else {
                wheelResultEl.textContent = segment.value + " pieces d'or ! Choisissez une consonne.";
                wheelResultEl.className = "wheel-result positive";
                infoLineEl.textContent = "Roue : " + segment.value + " PO. Choisissez une consonne.";
                canChooseConsonant = true;
            }

            updateKeyboard();
        }

        /* ============================================
           AFFICHAGE DE LA PHRASE
        ============================================ */
        function renderPhrase() {
            phraseContainerEl.innerHTML = "";
            for (const char of currentPhrase) {
                if (char === " ") {
                    const gap = document.createElement("span");
                    gap.className = "space-gap";
                    phraseContainerEl.appendChild(gap);
                } else if (char === "'") {
                    /* Apostrophe toujours visible */
                    const box = document.createElement("span");
                    box.className = "letter-box apostrophe";
                    box.textContent = "'";
                    phraseContainerEl.appendChild(box);
                } else {
                    const norm = normalizeLetter(char);
                    const box = document.createElement("span");
                    box.className = "letter-box";

                    if (revealedLetters.has(norm)) {
                        box.classList.add("revealed");
                        box.textContent = char;
                    }
                    if (gameWon) {
                        box.classList.add("won");
                        box.textContent = char;
                    }

                    phraseContainerEl.appendChild(box);
                }
            }
        }

        /* ============================================
           CLAVIER VIRTUEL
        ============================================ */
        function buildKeyboard() {
            consonantGridEl.innerHTML = "";
            vowelGridEl.innerHTML = "";

            "BCDFGHJKLMNPQRSTVWXZ".split("").forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "key-btn";
                btn.textContent = letter;
                btn.dataset.letter = letter;
                btn.disabled = true;
                btn.setAttribute("aria-label", "Consonne " + letter);
                btn.addEventListener("click", () => chooseConsonant(letter));
                consonantGridEl.appendChild(btn);
            });

            VOWELS.forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "key-btn vowel";
                btn.textContent = letter;
                btn.dataset.letter = letter;
                btn.disabled = true;
                btn.setAttribute("aria-label", "Voyelle " + letter);
                btn.addEventListener("click", () => chooseVowel(letter));
                vowelGridEl.appendChild(btn);
            });
        }

        function updateKeyboard() {
            consonantGridEl.querySelectorAll(".key-btn").forEach(btn => {
                const l = btn.dataset.letter;
                if (usedLetters.has(l)) {
                    btn.disabled = true;
                    btn.classList.remove("vowel");
                    btn.classList.add(revealedLetters.has(l) ? "used-correct" : "used-wrong");
                } else {
                    btn.disabled = !(canChooseConsonant && typeof currentWheelValue === "number");
                    btn.classList.remove("used-correct", "used-wrong");
                }
            });

            vowelGridEl.querySelectorAll(".key-btn").forEach(btn => {
                const l = btn.dataset.letter;
                if (usedLetters.has(l)) {
                    btn.disabled = true;
                    btn.classList.add(revealedLetters.has(l) ? "used-correct" : "used-wrong");
                } else {
                    btn.disabled = isSpinning || gameWon;
                    btn.classList.remove("used-correct", "used-wrong");
                }
            });

            guessBtnWheelEl.disabled = isSpinning || gameWon;
            spinBtnEl.disabled = isSpinning || canChooseConsonant || gameWon;
        }

        /* ============================================
           CHOIX D'UNE CONSONNE
        ============================================ */
        function chooseConsonant(letter) {
            if (!canChooseConsonant || usedLetters.has(letter) || typeof currentWheelValue !== "number") return;

            usedLetters.add(letter);
            const count = countInPhrase(letter);

            if (count > 0) {
                revealedLetters.add(letter);
                const earned = currentWheelValue * count;
                goldBalance += earned;
                updateGoldDisplay();
                showToast(count + " \"" + letter + "\" trouve" + (count > 1 ? "s" : "") + " ! +" + earned + " PO", "success");
                infoLineEl.textContent = "+" + earned + " PO gagnes ! Continuez.";
                renderPhrase();
                checkWin();
            } else {
                showToast("Pas de \"" + letter + "\" dans l'expression.", "error");
                infoLineEl.textContent = "Pas de \"" + letter + "\". Faites tourner la roue.";
                canChooseConsonant = false;
                currentWheelValue = null;
            }

            updateKeyboard();
        }

        /* ============================================
           CHOIX D'UNE VOYELLE — coût = occurrences × 5 PO
        ============================================ */
        function chooseVowel(letter) {
            if (usedLetters.has(letter) || isSpinning || gameWon) return;

            const count = countInPhrase(letter);
            const cost = count * VOWEL_COST_PER_OCCURRENCE;

            usedLetters.add(letter);
            goldBalance -= cost;
            updateGoldDisplay();

            if (count > 0) {
                revealedLetters.add(letter);
                renderPhrase();
                if (count === 1) {
                    showToast("1 \"" + letter + "\" trouve. Cout : " + cost + " PO", "info");
                } else {
                    showToast(count + " \"" + letter + "\" trouves. Cout : " + cost + " PO", "info");
                }
                infoLineEl.textContent = "Voyelle \"" + letter + "\" revelee. Cout : " + cost + " PO.";
                checkWin();
            } else {
                showToast("Pas de \"" + letter + "\". Cout : " + cost + " PO.", "error");
                infoLineEl.textContent = "Pas de \"" + letter + "\". " + cost + " PO depenses.";
            }

            canChooseConsonant = false;
            currentWheelValue = null;
            updateKeyboard();
        }

        /* ============================================
           VICTOIRE
        ============================================ */
        function checkWin() {
            const allRevealed = [...currentPhrase].every(ch => {
                if (ch === " " || ch === "'") return true;
                if (!isAlpha(ch)) return true;
                return revealedLetters.has(normalizeLetter(ch));
            });

            if (!allRevealed) return;

            gameWon = true;
            canChooseConsonant = false;

            /* Révéler toutes les lettres avec leur accent */
            revealedLetters.clear();
            for (const ch of currentPhrase) {
                if (isAlpha(ch)) revealedLetters.add(normalizeLetter(ch));
            }
            renderPhrase();
            updateKeyboard();

            goldBalance += 500;
            updateGoldDisplay();

            /* Lancer la célébration des guirlandes */
            startCelebration();

            setTimeout(() => {
                showModal(
                    "Bravo !",
                    '<p style="margin-bottom:12px;color:var(--fg);">Vous avez trouve :</p>' +
                    '<p style="font-family:Cinzel,serif;font-size:1.2rem;color:var(--accent-glow);margin-bottom:14px;letter-spacing:1px;line-height:1.4;">"' + currentDisplayPhrase + '"</p>' +
                    '<p style="color:var(--muted);">Bonus de victoire : +500 PO</p>' +
                    '<p style="font-size:1.2rem;font-weight:800;margin-top:10px;color:var(--accent);">Solde final : ' + goldBalance + ' PO</p>',
                    [{ text: "Nouvelle partie", cls: "primary", action: startNewGame }]
                );
            }, 600);
        }

        /* ============================================
           PROPOSER LA SOLUTION
        ============================================ */
        function openGuessModal() {
            showModal(
                "Faire une proposition",
                '<input type="text" class="modal-input" id="guessInput" placeholder="Tapez votre reponse..." autocomplete="off">',
                [
                    { text: "Valider", cls: "primary", action: submitGuess },
                    { text: "Annuler", cls: "secondary", action: closeModal }
                ]
            );
            setTimeout(() => {
                const inp = document.getElementById("guessInput");
                if (inp) inp.focus();
            }, 120);
        }

        function submitGuess() {
            const inp = document.getElementById("guessInput");
            if (!inp) return;

            /* Normaliser la saisie : majuscules, sans accents, un seul espace */
            const guess = inp.value
                .trim()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .toUpperCase()
                .replace(/\s+/g, " ");

            /* Comparer avec la phrase normalisée */
            const target = currentPhrase.toUpperCase().replace(/\s+/g, " ");
            closeModal();

            if (guess === target) {
                gameWon = true;
                canChooseConsonant = false;

                revealedLetters.clear();
                for (const ch of currentPhrase) {
                    if (isAlpha(ch)) revealedLetters.add(normalizeLetter(ch));
                }
                renderPhrase();
                updateKeyboard();

                goldBalance += 500;
                updateGoldDisplay();

                startCelebration();

                setTimeout(() => {
                    showModal(
                        "Bravo !",
                        '<p style="margin-bottom:12px;color:var(--fg);">Vous avez trouve :</p>' +
                        '<p style="font-family:Cinzel,serif;font-size:1.2rem;color:var(--accent-glow);margin-bottom:14px;letter-spacing:1px;line-height:1.4;">"' + currentDisplayPhrase + '"</p>' +
                        '<p style="color:var(--muted);">Bonus de victoire : +500 PO</p>' +
                        '<p style="font-size:1.2rem;font-weight:800;margin-top:10px;color:var(--accent);">Solde final : ' + goldBalance + ' PO</p>',
                        [{ text: "Nouvelle partie", cls: "primary", action: startNewGame }]
                    );
                }, 400);
            } else {
                showToast("Mauvaise reponse !", "error");
                infoLineEl.textContent = "Mauvaise reponse. Continuez a jouer !";
                canChooseConsonant = false;
                currentWheelValue = null;
                updateKeyboard();
            }
        }

        /* ============================================
           MODAL
        ============================================ */
        function showModal(title, contentHTML, buttons) {
            modalTitleEl.textContent = title;
            modalContentEl.innerHTML = contentHTML;
            modalActionsEl.innerHTML = "";
            buttons.forEach(b => {
                const el = document.createElement("button");
                el.className = "modal-btn " + (b.cls || "");
                el.textContent = b.text;
                el.addEventListener("click", b.action);
                modalActionsEl.appendChild(el);
            });
            modalOverlayEl.classList.add("active");
        }

        function closeModal() {
            modalOverlayEl.classList.remove("active");
        }

        /* ============================================
           TOASTS
        ============================================ */
        function showToast(message, type) {
            type = type || "info";
            const t = document.createElement("div");
            t.className = "toast " + type;
            t.textContent = message;
            toastContainerEl.appendChild(t);
            setTimeout(() => { if (t.parentNode) t.remove(); }, 3200);
        }

        /* ============================================
           AFFICHAGE DES PIÈCES D'OR
        ============================================ */
        function updateGoldDisplay() {
            goldDisplayEl.textContent = goldBalance;
            goldDisplayEl.className = "gold-amount" + (goldBalance < 0 ? " negative" : "");
        }

        /* ============================================
           NOUVELLE PARTIE
        ============================================ */
        function startNewGame() {
            closeModal();

            /* Arrêter une éventuelle célébration en cours */
            if (celebrationInterval) {
                clearInterval(celebrationInterval);
                celebrationInterval = null;
            }
            document.body.classList.remove("celebrating");
            restoreGarlandColors();

            const idx = Math.floor(Math.random() * phrases.length);
            currentPhrase = phrases[idx].text;
            currentDisplayPhrase = phrasesDisplay[idx];
            currentCategory = phrases[idx].cat;
            revealedLetters = new Set();
            usedLetters = new Set();
            currentWheelValue = null;
            canChooseConsonant = false;
            gameWon = false;
            isSpinning = false;

            categoryDisplayEl.textContent = currentCategory;
            wheelResultEl.textContent = "";
            wheelResultEl.className = "wheel-result";
            infoLineEl.textContent = "Faites tourner la roue pour commencer !";

            renderPhrase();
            buildKeyboard();
            updateKeyboard();
            drawWheel();
        }

        /* ============================================
           ÉVÉNEMENTS
        ============================================ */
        spinBtnEl.addEventListener("click", spinWheel);
        guessBtnWheelEl.addEventListener("click", openGuessModal);
        newGameBtnEl.addEventListener("click", startNewGame);

        backBtnEl.addEventListener("click", () => {
            showModal(
                "Retour au Village",
                '<p style="color:var(--muted);">Voulez-vous vraiment quitter la partie en cours ?</p>',
                [
                    { text: "Quitter", cls: "primary", action: () => { closeModal; window.location.href = "#"; } },
                    { text: "Rester", cls: "secondary", action: closeModal }
                ]
            );
        });

        document.addEventListener("keydown", e => {
            if (!modalOverlayEl.classList.contains("active")) return;
            if (e.key === "Enter") {
                const inp = document.getElementById("guessInput");
                if (inp && document.activeElement === inp) submitGuess();
            }
            if (e.key === "Escape") closeModal();
        });

        modalOverlayEl.addEventListener("click", e => {
            if (e.target === modalOverlayEl) closeModal();
        });

        /* ============================================
           INITIALISATION
        ============================================ */
        createGarlands();
        startNewGame();
    </script>
</body>
</html>
