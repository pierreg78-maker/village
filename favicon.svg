<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond circulaire chaleureux -->
  <circle cx="32" cy="32" r="30" fill="#2c3e50" />
  
  <!-- Silhouette du village (Toits uniformisés) -->
  
  <!-- Maison gauche -->
  <polygon points="16,30 24,22 32,30" fill="#bdc3c7" />
  <rect x="18" y="30" width="12" height="18" fill="#bdc3c7" />
  
  <!-- Maison droite -->
  <polygon points="32,28 40,20 48,28" fill="#bdc3c7" />
  <rect x="34" y="28" width="12" height="20" fill="#bdc3c7" />

  <!-- Bâtiment du milieu / fond (Toit remplacé par un triangle) -->
  <polygon points="24,24 32,16 40,24" fill="#ecf0f1" /> <!-- Nouveau toit triangulaire -->
  <rect x="26" y="24" width="12" height="24" fill="#ecf0f1" /> <!-- Corps du bâtiment -->
  
  <!-- Arbre (Devant la maison de droite) -->
  <circle cx="42" cy="40" r="6" fill="#27ae60" /> 
  <rect x="40" y="42" width="4" height="6" fill="#795548" /> 
  
  <!-- Base / Sol -->
  <rect x="12" y="48" width="40" height="4" rx="2" fill="#e74c3c" />
</svg>
